name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The app and its tests have no dependencies, so there is nothing to
      # install (wrangler is only needed on a machine that deploys).
      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Build the published site
        run: |
          node tools/build-site.mjs
          test -f dist/_headers || { echo "dist/_headers missing: security headers would not be sent"; exit 1; }
          grep -q "frame-ancestors 'none'" dist/_headers || { echo "anti-framing header missing"; exit 1; }
          for f in index.html app/index.html app/logo.svg app/favicon.svg; do test -f "dist/$f" || { echo "dist/$f missing"; exit 1; }; done
          echo "dist/ ok: $(find dist -type f | wc -l) files"
